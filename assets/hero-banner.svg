  <text x="34" y="242" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11.5" font-weight="500">Fast Billing &amp; Data Entry  •  Zero Internet Needed  •  Local Database Tracking  •  Excel Automation</text>
